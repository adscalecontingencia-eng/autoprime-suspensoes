# Workflow for building and deploying a Vite app to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      # Give every sitemap URL its own .html file (served without redirect) so GitHub Pages answers 200 instead of 404.
      - name: Add HTML entry for each sitemap route
        run: |
          grep -o '<loc>[^<]*' public/sitemap.xml | sed 's#<loc>https://www.autoprimesuspensoes.com.br/\?##' | while read -r p; do
            [ -z "$p" ] && continue
            mkdir -p "dist/$(dirname "$p")" && cp dist/index.html "dist/$p.html"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
